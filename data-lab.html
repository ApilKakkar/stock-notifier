<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Laboratory</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230d3531'/><rect x='14' y='14' width='16' height='16' rx='4' fill='%233fb36b'/><rect x='34' y='14' width='16' height='16' rx='4' fill='%23e9f6f1'/><rect x='14' y='34' width='16' height='16' rx='4' fill='%23e9f6f1'/><rect x='34' y='34' width='16' height='16' rx='4' fill='%23bcdadd'/></svg>">
<meta name="theme-color" content="#c6e0e4">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet"><!-- optional font; falls back to system fonts offline -->
<style>
/* Same tokens as info-box.html (Syntix-style, light day theme only) */
:root{
  color-scheme:light;
  --page:#c6e0e4; --page2:#dcecee; --cream:#fbf7f3; --surface:#ffffff;
  --ink:#10332e; --muted:#566f6b; --line:#e5eae7;
  --dark:#0d3531; --dark-ink:#e9f6f1; --accent:#3fb36b;
  --teal:#2a7a82; --teal-soft:#e4f1f2; --teal-mid:#bcdadd;
  --ok:#1d7a4a; --okbg:#dff3e7; --warn:#8a5a00; --warnbg:#fbefd2; --bad:#a3302a; --badbg:#f8e1df;
  --shadow:0 10px 30px rgba(16,51,46,.08); --glass:rgba(255,255,255,.6);
  --c1:#2a7a82; --c2:#3fb36b; --c3:#c98a1a; --c4:#7a4fb0;
  --ease:cubic-bezier(.2,.8,.2,1); --dur:.45s;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:15px/1.6 "Urbanist",-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
  background:linear-gradient(180deg,var(--page) 0,var(--page2) 480px,var(--page) 100%);min-height:100vh}
button,select,input{font:inherit;color:inherit}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em}
.logo i{background:var(--dark);display:grid;place-items:center;color:var(--accent);font-style:normal}
.topbar{padding:10px 24px}
.topbar .bar{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:16px}
.topbar .logo{font-size:17px;white-space:nowrap;flex:none}
.topbar .logo i{width:26px;height:26px;border-radius:8px;font-size:13px}
.xlink{font-size:13px;font-weight:600;color:var(--teal);text-decoration:none;border:1px solid var(--teal-mid);border-radius:3px;padding:5px 11px;background:var(--glass);white-space:nowrap}
.xlink:hover{background:var(--teal-soft)}
.status{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status b{color:var(--ink)}
.band{background:var(--cream);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(16,51,46,.06);min-height:calc(100vh - 56px)}
main{max-width:1040px;margin:0 auto;padding:18px 24px 40px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.nb{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:3px;border:1px solid var(--teal-mid);background:var(--surface);cursor:pointer;font-size:13px;font-weight:600;transition:background .15s,transform .15s}
.nb:hover:not(:disabled){background:var(--teal-soft)} .nb:active:not(:disabled){transform:scale(.96)}
.nb:disabled{opacity:.4;cursor:default}
.nb.primary{background:var(--dark);color:#fff;border-color:var(--dark);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) calc(100% - 7px),calc(100% - 7px) 100%,0 100%)}
.nb.primary:hover:not(:disabled){background:var(--dark);filter:brightness(1.15)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-left:6px;font-size:13.5px;color:var(--muted)}
.crumbs a{color:var(--teal);text-decoration:none;font-weight:600;cursor:pointer}
.crumbs .sep{opacity:.5} .crumbs .here{color:var(--ink);font-weight:700}
.vhead{margin:0 0 16px}
.vhead h2{font-size:26px;letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:10px}
.vhead h2::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--accent)}
.vhead p{margin:4px 0 0;color:var(--muted)}
/* root cards */
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{position:relative;display:flex;flex-direction:column;justify-content:flex-start;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px 56px;min-height:200px;
  box-shadow:0 4px 18px rgba(16,51,46,.05);transition:transform .2s var(--ease),box-shadow .2s;animation:pop .45s var(--ease) both;animation-delay:var(--d,0ms)}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card h3{margin:0 0 6px;font-size:21px;letter-spacing:-.02em;line-height:1.2}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .big{font-size:30px;font-weight:700;letter-spacing:-.03em;margin:10px 0 0;line-height:1.1}
.card .big small{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:6px}
.card svg.spark{display:block;width:100%;height:46px;margin-top:10px}
.eyebrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.go{position:absolute;right:16px;bottom:14px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:17px;box-shadow:var(--shadow);transition:transform .2s var(--ease)}
.card:hover .go{transform:translateX(3px)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips span{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--teal-soft);color:var(--teal);font-weight:600}
code{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--teal-soft);color:var(--teal);padding:1px 6px;border-radius:5px;overflow-wrap:anywhere}
.tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:999px;white-space:nowrap}
.t-ok{background:var(--okbg);color:var(--ok)} .t-warn{background:var(--warnbg);color:var(--warn)} .t-bad{background:var(--badbg);color:var(--bad)} .t-info{background:var(--teal-soft);color:var(--teal)}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:16px;animation:pop .4s var(--ease) both}
.panel h4{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--teal)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--teal-mid);border-radius:3px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;border-right:1px solid var(--teal-mid)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--dark);color:#fff}
.seg button:hover:not(.on){background:var(--teal-soft)}
select,.inp{height:34px;border:1px solid var(--teal-mid);border-radius:3px;background:var(--surface);padding:0 10px;font-size:13.5px}
.inp:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
.picked{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 6px 4px 10px;border-radius:999px;background:var(--teal-soft)}
.pill i{width:9px;height:9px;border-radius:50%;display:inline-block}
.pill button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:14px;line-height:1;padding:0 4px}
.pill button:hover{color:var(--bad)}
.hint{font-size:12.5px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;margin:0 0 14px}
.stats div{background:var(--teal-soft);border-radius:12px;padding:9px 13px;min-width:0}
.stats dt{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--teal);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats dd{margin:2px 0 0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.pos{color:var(--ok)} .neg{color:var(--bad)}
/* charts */
.chart{position:relative;width:100%;user-select:none}
.chart svg{display:block;width:100%;overflow:visible}
.chart .axis text{font-size:11px;fill:var(--muted)}
.chart .grid line{stroke:var(--line)}
.tip{position:absolute;pointer-events:none;background:var(--dark);color:#fff;border-radius:10px;padding:8px 11px;font-size:12px;line-height:1.45;box-shadow:var(--shadow);white-space:nowrap;opacity:0;transition:opacity .1s;z-index:3}
.tip b{color:var(--accent)} .tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
/* tables */
table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:13.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--teal-soft);color:var(--teal);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
td code,td.nw{white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:#f6fbfa}
.tw{overflow-x:auto;max-height:520px;overflow-y:auto}
.empty{color:var(--muted);padding:26px 10px;text-align:center}
.empty pre{display:inline-block;text-align:left;background:var(--teal-soft);color:var(--teal);padding:12px 16px;border-radius:12px;font-size:12.5px;margin:12px 0 0;white-space:pre-wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
footer{padding:24px;color:var(--muted);font-size:12.5px;text-align:center;background:linear-gradient(180deg,var(--cream),var(--page2))}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
@keyframes zin{from{opacity:0;transform:scale(.6)}}
@keyframes zout{from{opacity:0;transform:scale(1.25);filter:blur(3px)}}
.zin{animation:zin var(--dur) var(--ease) both} .zout{animation:zout var(--dur) var(--ease) both}
.skel{height:280px;border-radius:14px;background:linear-gradient(90deg,var(--teal-soft),#f3f9f8,var(--teal-soft));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:720px){
  .topbar{padding:10px 16px} main{padding:18px 16px 40px} .status{display:none}
  .grid4,.two{grid-template-columns:1fr} .card{min-height:0} .panel{padding:18px 16px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="bar">
    <a class="xlink" href="./" title="Back to the Stock Notifier home page">← Stock Notifier</a>
    <div class="logo"><i>◆</i>Data Lab</div>
    <div class="status" id="status">Loading…</div>
  </div>
</header>

<div class="band"><main>
  <div class="toolbar">
    <button class="nb" id="bk" title="Back (Alt+←)">← Back</button>
    <button class="nb primary" id="home" title="Home (Esc)">⌂ Home</button>
    <button class="nb" id="reload" title="Re-read the data files">↻ Refresh</button>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  </div>
  <div id="stage" aria-live="polite"></div>
</main></div>
<footer>Data Laboratory · read-only view of <code>data/raw</code> (Parquet + manifest.json) · fill it with <code>python -m src.ingest.run all</code></footer>

<script>
/* ============================================================
   DATA LABORATORY — viewer for the data we actually collected.
   Reads the read-only JSON API in app/main.py (/api/data/*).
   Root = 4 cards (max 4 per level, same rule as the Information Box):
     Overview · Prices · Macro · Universe
   Deep links: #/prices?m=nifty50&t=RELIANCE.NS,TCS.NS&r=5y&f=adj_close
   ============================================================ */
const VIEWS = [
  { id:'overview', t:'Overview',  d:'What has been pulled: datasets, rows, date ranges, gaps and validation issues (manifest.json).' },
  { id:'prices',   t:'Prices',    d:'Daily stock prices for NIFTY 50 and S&P 100 — chart, volume, returns, drawdown, compare up to 4.' },
  { id:'macro',    t:'Macro',     d:'Market backdrop: India VIX, USD/INR, gold, oil, crypto, rates and indices.' },
  { id:'universe', t:'Universe',  d:'The stock lists we pull, and which stocks already have price data.' },
];
const MARKET_LABEL = { nifty50:'NIFTY 50', sp100:'S&P 100' };
const MACRO_LABEL = {
  nifty50:'NIFTY 50 index', bank_nifty:'Bank NIFTY', india_vix:'India VIX', usdinr:'USD/INR', goldbees_inr:'GOLDBEES (₹)',
  india_10y_monthly:'India 10Y yield (monthly)', sp500:'S&P 500', sp100:'S&P 100 index', vix:'VIX', vix_fred:'VIX (FRED)',
  us_10y:'US 10Y yield', us_3m_tbill:'US 3M T-bill', gold_usd:'Gold ($)', silver_usd:'Silver ($)', brent:'Brent crude ($)',
  wti:'WTI crude ($)', btc_usd:'Bitcoin ($)', eth_usd:'Ethereum ($)' };
const RANGES = [['1y','1Y'],['3y','3Y'],['5y','5Y'],['10y','10Y'],['all','All']];
const COLORS = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)'];

/* ----------------------------------------------------------- utils */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let LOC = 'en-IN';   // lakh/crore grouping for India; switched to en-US for US / $ data
const nf = (v, d=2) => v==null || isNaN(v) ? '—' : Number(v).toLocaleString(LOC, {maximumFractionDigits:d, minimumFractionDigits:d});
const big = v => v==null ? '—' : LOC==='en-US' ? (v>=1e9 ? (v/1e9).toFixed(2)+' B' : v>=1e6 ? (v/1e6).toFixed(2)+' M' : v>=1e3 ? (v/1e3).toFixed(1)+'k' : String(Math.round(v))) : v>=1e7 ? (v/1e7).toFixed(2)+' Cr' : v>=1e5 ? (v/1e5).toFixed(2)+' L' : v>=1e3 ? (v/1e3).toFixed(1)+'k' : String(Math.round(v));
const pct = (v, d=1) => v==null ? '—' : `<span class="${v>=0?'pos':'neg'}">${v>=0?'+':''}${(v*100).toFixed(d)}%</span>`;
const bytes = b => b>1e6 ? (b/1e6).toFixed(1)+' MB' : b>1e3 ? (b/1e3).toFixed(0)+' KB' : b+' B';
const ago = iso => { if(!iso) return '—'; const m=(Date.now()-new Date(iso))/6e4;
  return m<1?'just now':m<60?Math.round(m)+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'; };
const startFor = r => { if(!r || r==='all') return ''; const d=new Date(); d.setFullYear(d.getFullYear()-parseInt(r)); return d.toISOString().slice(0,10); };
const label = s => MACRO_LABEL[s] || s;
const INDIA_SERIES = /nifty50|bank_nifty|india|goldbees|usdinr/;

const cache = new Map();
async function api(path, fresh=false){
  if(!fresh && cache.has(path)) return cache.get(path);
  const p = fetch(path, {headers:{Accept:'application/json'}}).then(async r => {
    const body = await r.json().catch(() => ({}));
    if(!r.ok) throw Object.assign(new Error(body.detail || r.statusText), {status:r.status});
    return body;
  });
  cache.set(path, p); p.catch(() => cache.delete(path));
  return p;
}

const RUN_HELP = `python3 -m venv .venv && source .venv/bin/activate
pip install -r requirements.txt -r requirements-data.txt
python -m src.ingest.run all --limit 5      # quick test
python -m src.ingest.run all                # full pull
uvicorn app.main:app --reload --port 8080   # then open /data-lab`;
const emptyHTML = (msg, help=true) => `<div class="empty">${esc(msg)}${help?`<br><pre>${esc(RUN_HELP)}</pre>`:''}</div>`;

/* ----------------------------------------------------------- routing */
function parseHash(){
  const h = location.hash.replace(/^#\/?/, ''); const [v, q=''] = h.split('?');
  return { view: VIEWS.some(x => x.id===v) ? v : '', p: Object.fromEntries(new URLSearchParams(q)) };
}
function hashFor(view, p={}){
  const q = new URLSearchParams(Object.entries(p).filter(([,v]) => v!=null && v!=='')).toString();
  return '#/' + view + (q ? '?' + q.replace(/%2C/g, ',') : '');
}
let route = parseHash(), lastView = null;
function nav(view, p={}, replace=false){
  const h = hashFor(view, p);
  if(replace) history.replaceState(null, '', h); else if(location.hash !== h) history.pushState(null, '', h);
  route = parseHash(); render();
}
window.addEventListener('popstate', () => { route = parseHash(); render(); });

/* ----------------------------------------------------------- chart (hand-drawn SVG) */
function niceTicks(min, max, n=5){
  if(min===max){ min-=1; max+=1; }
  const span = max-min, step0 = span/n, mag = 10**Math.floor(Math.log10(step0));
  const step = [1,2,2.5,5,10].map(m => m*mag).find(s => span/s <= n) || mag*10;
  const t = []; for(let v=Math.ceil(min/step)*step; v<=max+1e-9; v+=step) t.push(+v.toFixed(10));
  return t;
}
/* series: [{name, color, pts:[[Date, value]]}]; opts: {height, fmt, bars:[[Date, v]]} */
function drawChart(el, series, opts={}){
  const W = Math.max(320, el.clientWidth), H = opts.height || 300, bH = opts.bars ? 60 : 0;
  const m = {l:56, r:14, t:10, b:24 + (bH ? bH + 22 : 0)};
  const all = series.flatMap(s => s.pts).filter(p => p[1]!=null);
  if(!all.length){ el.innerHTML = emptyHTML('No points in this window.', false); return; }
  const x0 = Math.min(...all.map(p => +p[0])), x1 = Math.max(...all.map(p => +p[0]));
  let y0 = Math.min(...all.map(p => p[1])), y1 = Math.max(...all.map(p => p[1]));
  const pad = (y1-y0)*0.06 || Math.abs(y1)*0.05 || 1; y0 -= pad; y1 += pad;
  const yt = niceTicks(y0, y1, 5); y0 = Math.min(y0, yt[0]); y1 = Math.max(y1, yt[yt.length-1]);
  const iw = W-m.l-m.r, ih = H-m.t-m.b;
  const X = t => m.l + (x1===x0 ? iw/2 : (t-x0)/(x1-x0)*iw), Y = v => m.t + ih - (v-y0)/(y1-y0)*ih;
  const fmt = opts.fmt || (v => nf(v, Math.abs(v)<10 ? 2 : 0));
  // x ticks: years (or months for short windows)
  const spanY = (x1-x0)/(365.25*864e5), xt = [];
  if(spanY > 2){ const st = spanY>12?2:1; for(let y=new Date(x0).getFullYear()+1; y<=new Date(x1).getFullYear(); y+=st) xt.push([+new Date(y,0,1), String(y)]); }
  else { const d=new Date(x0); d.setDate(1); d.setMonth(d.getMonth()+1); const st=spanY>1?3:1;
    while(+d<=x1){ xt.push([+d, d.toLocaleString('en',{month:'short'})+(d.getMonth()===0?" '"+String(d.getFullYear()).slice(2):'')]); d.setMonth(d.getMonth()+st); } }
  let g = `<g class="grid">${yt.map(v => `<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/>`).join('')}</g>`;
  g += `<g class="axis">${yt.map(v => `<text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${esc(fmt(v))}</text>`).join('')}
        ${xt.map(([t,l]) => `<text x="${X(t)}" y="${m.t+ih+16}" text-anchor="middle">${esc(l)}</text>`).join('')}</g>`;
  if(opts.base!=null && opts.base>y0 && opts.base<y1) g += `<line x1="${m.l}" x2="${W-m.r}" y1="${Y(opts.base)}" y2="${Y(opts.base)}" stroke="var(--teal-mid)" stroke-dasharray="4 4"/>`;
  if(opts.bars){
    const vmax = Math.max(...opts.bars.map(b => b[1]||0)) || 1, by = H-bH-4, bw = Math.max(1, iw/opts.bars.length*0.8);
    g += `<g fill="var(--teal-mid)">${opts.bars.map(([t,v]) => `<rect x="${X(+t)-bw/2}" y="${by+bH-(v||0)/vmax*bH}" width="${bw}" height="${(v||0)/vmax*bH}"/>`).join('')}</g>
          <text class="axis" x="${m.l-8}" y="${by+10}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(big(vmax))}</text>
          <text x="${m.l}" y="${by-2}" font-size="10.5" fill="var(--muted)" font-weight="700" letter-spacing=".06em">VOLUME</text>`;
  }
  series.forEach(s => {
    let d = '', pen = false;
    s.pts.forEach(([t,v]) => { if(v==null){ pen=false; return; } d += (pen?'L':'M') + X(+t).toFixed(1) + ' ' + Y(v).toFixed(1); pen = true; });
    const id = 'g'+Math.random().toString(36).slice(2,8), last = s.pts.filter(p => p[1]!=null).pop();
    if(series.length===1 && !opts.noFill){
      const f = s.pts.filter(p => p[1]!=null);
      g += `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".18"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs>
            <path d="M${X(+f[0][0])} ${m.t+ih} ${f.map(([t,v]) => 'L'+X(+t).toFixed(1)+' '+Y(v).toFixed(1)).join(' ')} L${X(+f[f.length-1][0])} ${m.t+ih}Z" fill="url(#${id})"/>`;
    }
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(last) g += `<circle cx="${X(+last[0])}" cy="${Y(last[1])}" r="3.2" fill="${s.color}"/>`;
  });
  g += `<line class="cross" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="var(--ink)" stroke-opacity=".25" style="display:none"/>
        <g class="dots"></g><rect x="${m.l}" y="${m.t}" width="${iw}" height="${H-m.t-4}" fill="transparent"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(series.map(s=>s.name).join(', '))} chart">${g}</svg><div class="tip"></div>`;
  // hover: nearest date on the first series
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), cross = svg.querySelector('.cross'), dots = svg.querySelector('.dots');
  const ref = series[0].pts;
  const near = (pts, t) => { let lo=0, hi=pts.length-1; while(lo<hi){ const mid=(lo+hi)>>1; if(+pts[mid][0]<t) lo=mid+1; else hi=mid; }
    return lo>0 && Math.abs(+pts[lo-1][0]-t) < Math.abs(+pts[lo][0]-t) ? pts[lo-1] : pts[lo]; };
  svg.addEventListener('mousemove', e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX-r.left)*(W/r.width);
    const t = x0 + (px-m.l)/iw*(x1-x0), p = near(ref, t); if(!p) return;
    const cx = X(+p[0]); cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.style.display = '';
    const rows = series.map(s => [s, near(s.pts, +p[0])]);
    dots.innerHTML = rows.filter(([,q]) => q && q[1]!=null).map(([s,q]) => `<circle cx="${X(+q[0])}" cy="${Y(q[1])}" r="4" fill="${s.color}" stroke="#fff" stroke-width="1.5"/>`).join('');
    const bar = opts.bars ? near(opts.bars, +p[0]) : null;
    tip.innerHTML = `<b>${p[0].toISOString().slice(0,10)}</b><br>` + rows.map(([s,q]) => `<i style="background:${s.color}"></i>${esc(s.name)}: ${q && q[1]!=null ? esc(fmt(q[1])) : '—'}`).join('<br>')
      + (bar ? `<br>Volume: ${big(bar[1])}` : '');
    tip.style.opacity = 1;
    const tx = cx/W*r.width; tip.style.left = Math.min(r.width - tip.offsetWidth - 4, Math.max(4, tx + 14)) + 'px'; tip.style.top = '8px';
  });
  svg.addEventListener('mouseleave', () => { tip.style.opacity = 0; cross.style.display = 'none'; dots.innerHTML = ''; });
}
function sparkSVG(pts, color='var(--c1)'){
  const v = pts.map(p => p[1]).filter(x => x!=null); if(v.length<2) return '';
  const lo = Math.min(...v), hi = Math.max(...v), W = 300, H = 46;
  const d = v.map((y,i) => (i?'L':'M') + (i/(v.length-1)*W).toFixed(1) + ' ' + (H-3-(y-lo)/((hi-lo)||1)*(H-6)).toFixed(1)).join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
const toPts = (rows, key) => rows.map(r => [new Date(r.date + 'T00:00:00Z'), r[key]]);

async function renderOverview(el){

  const ds = Object.entries(m.manifest);
  if(!ds.length){ $('#ov').innerHTML = `<div class="panel">${emptyHTML('No manifest.json found in ' + m.data_dir + '.')}</div>`; return; }
  const health = d => { const v = d.validation||{}, iss = (v.issues||[]).length, miss = (d.missing_tickers||d.missing_series||[]).length;
    return iss ? `<span class="tag t-warn">${iss} issue${iss>1?'s':''}</span>` : miss ? `<span class="tag t-warn">${miss} missing</span>` : '<span class="tag t-ok">Clean</span>'; };
  const link = k => k.startsWith('prices/') ? `#/prices?m=${k.split('/')[1]}` : k.startsWith('macro/') ? '#/macro' : '';
  let h = `<div class="panel"><h4>Datasets</h4><div class="tw"><table><thead><tr><th>Dataset</th><th>Source</th><th class="n">Rows</th><th class="n">Items</th><th>From → to</th><th>Health</th><th>Pulled</th></tr></thead><tbody>`;
  for(const [k,d] of ds){
    const v = {...(d.validation||{})}, items = v.tickers ?? v.series ?? d.tickers ?? d.requested ?? '—';
    if(!v.min_date && v.by_series){ const b = Object.values(v.by_series); v.min_date = b.map(x => x.from).sort()[0]; v.max_date = b.map(x => x.to).sort().pop(); }
    h += `<tr class="${link(k)?'click':''}" data-href="${link(k)}"><td><b>${esc(k)}</b></td><td>${esc(d.source||'')}</td><td class="n">${nf(v.rows ?? d.rows,0)}</td><td class="n">${esc(items)}</td>
      <td class="nw">${esc(v.min_date||'')}${v.min_date?' → ':''}${esc(v.max_date||'')}</td><td>${health(d)}</td><td title="${esc(d.fetched_at||'')}">${ago(d.fetched_at)}</td></tr>`;
  }
  h += `</tbody></table></div></div>`;
  // problems & caveats
  const notes = [];
  for(const [k,d] of ds){
    (d.missing_tickers||[]).length && notes.push(`<b>${esc(k)}</b>: missing tickers ${esc(d.missing_tickers.join(', '))}`);
    (d.missing_series||[]).length && notes.push(`<b>${esc(k)}</b>: missing series ${esc(d.missing_series.join(', '))}`);
    ((d.validation||{}).issues||[]).forEach(i => notes.push(`<b>${esc(k)}</b>: ${esc(i)}`));

    d.note && notes.push(`<b>${esc(k)}</b>: ${esc(d.note)}`);
  }

  const macro = m.manifest['macro/macro_daily'];
  const series = macro && (macro.validation||{}).by_series ? Object.entries(macro.validation.by_series) : [];
  h += `<div class="two"><div class="panel"><h4>Problems & caveats</h4>${notes.length ? `<ul style="margin:0;padding-left:18px">${notes.map(n => `<li style="margin-bottom:6px">${n}</li>`).join('')}</ul>` : '<p class="hint">Nothing flagged.</p>'}</div>
        <div class="panel"><h4>Files on disk</h4><div class="tw"><table><thead><tr><th>File</th><th class="n">Size</th></tr></thead><tbody>${m.files.map(f => `<tr><td><code>${esc(f.path)}</code></td><td class="n">${bytes(f.bytes)}</td></tr>`).join('')}</tbody></table></div></div></div>`;
  if(series.length){
    const today = new Date();
    h += `<div class="panel"><h4>Macro series coverage</h4><div class="tw"><table><thead><tr><th>Series</th><th>From</th><th>To</th><th class="n">Rows</th><th>Freshness</th></tr></thead><tbody>
      ${series.map(([s,r]) => { const lag = Math.round((today - new Date(r.to))/864e5);
        return `<tr class="click" data-href="#/macro?s=${encodeURIComponent(s)}"><td><b>${esc(label(s))}</b> <code>${esc(s)}</code></td><td>${esc(r.from)}</td><td>${esc(r.to)}</td><td class="n">${nf(r.n,0)}</td>

  }
  $('#ov').innerHTML = h;
  $('#ov').querySelectorAll('tr[data-href]').forEach(tr => { if(tr.dataset.href) tr.onclick = () => { location.hash = tr.dataset.href; }; });

  const S = r.series, one = picked.length===1, src = Object.fromEntries(sum.series.map(s => [s.series, s.source]));
  const isRate = s => /10y|tbill|vix/.test(s);
  $('#mbody').innerHTML = `<div class="panel"><div class="tw" style="margin-bottom:14px"><table><thead><tr><th>Series</th><th>Source</th><th class="n">Last</th><th class="n">Change (${esc(range)})</th><th class="n">Min</th><th class="n">Max</th><th>From → to</th></tr></thead><tbody>
      ${picked.map((s,i) => { const x = S[s].stats||{}; return `<tr><td><span class="pill" style="padding:2px 10px"><i style="background:${COLORS[i]}"></i>${esc(label(s))}</span></td><td>${esc(src[s]||'')}</td>
      <td class="n"><b>${nf(x.last)}</b></td><td class="n">${isRate(s) ? (x.change==null?'—':`<span class="${x.change>=0?'pos':'neg'}">${x.change>=0?'+':''}${nf(x.change)}</span> pts`) : pct(x.pct_change)}</td>
      <td class="n">${nf(x.min)}</td><td class="n">${nf(x.max)}</td><td>${esc(S[s].from||'—')} → ${esc(S[s].to||'—')}</td></tr>`; }).join('')}</tbody></table></div>
      <div class="chart" id="mc"></div><p class="hint" style="margin:8px 0 0">${one ? 'Raw values' : 'Rebased to 100 at window start'} · rates, yields and VIX change shown in points; prices in %.</p></div>
    <div class="panel"><h4>Last ${S[picked[0]].tail.length} observations · ${esc(label(picked[0]))}</h4><div class="tw"><table><thead><tr><th>Date</th><th class="n">Value</th></tr></thead><tbody>
      ${S[picked[0]].tail.map(x => `<tr><td>${esc(x.date)}</td><td class="n">${nf(x.value)}</td></tr>`).join('')}</tbody></table></div></div>`;
  const draw = () => {
    if(one) drawChart($('#mc'), [{name:label(picked[0]), color:COLORS[0], pts:toPts(S[picked[0]].points,'value')}], {height:340});
    else drawChart($('#mc'), picked.map((s,i) => { const pts = toPts(S[s].points,'value'), b = (pts.find(q => q[1]!=null)||[])[1];
      return {name:label(s), color:COLORS[i], pts:pts.map(([d,v]) => [d, v==null||!b ? null : v/b*100])}; }), {height:340, base:100, fmt:v => nf(v,0)});
  };
  draw(); redraw = draw;
}

/* ----------------------------------------------------------- universe */
async function renderUniverse(el){
  const market = MARKET_LABEL[route.p.m] ? route.p.m : 'nifty50';
  el.innerHTML = `<div class="vhead"><h2>Universe</h2><p>Constituent lists we pull (current members only — survivorship bias until Bloomberg historical constituents). Click a stock to chart it.</p></div>
    <div class="panel"><div class="controls">
      <div class="seg" id="mk">${Object.entries(MARKET_LABEL).map(([k,l]) => `<button data-k="${k}" class="${k===market?'on':''}">${l}</button>`).join('')}</div>
      <input class="inp" id="flt" type="search" placeholder="Filter by ticker, name or sector…" style="min-width:240px">
      <div class="seg" id="only"><button data-k="all" class="on">All</button><button data-k="yes">With prices</button><button data-k="no">Not pulled</button></div>
      <span class="hint" id="cnt"></span>
    </div><div id="ubody"><div class="skel"></div></div></div>`;
  el.querySelectorAll('#mk button').forEach(b => b.onclick = () => nav('universe', {m:b.dataset.k}));
  let u; try{ u = await api('api/data/universe/' + market); }
  catch(e){ $('#ubody').innerHTML = emptyHTML(e.status===404 ? `No ${MARKET_LABEL[market]} universe snapshot yet.` : 'API error: ' + e.message); return; }
  const sectors = {}; u.rows.forEach(r => { const k = r.sector || '—'; sectors[k] = (sectors[k]||0) + 1; });
  let only = 'all';
  const paint = () => {
    const q = $('#flt').value.trim().toLowerCase();
    const rows = u.rows.filter(r => (only==='all' || (only==='yes') === r.has_prices) && (!q || [r.ticker, r.name, r.sector].join(' ').toLowerCase().includes(q)));
    $('#cnt').textContent = `${rows.length} of ${u.count} · ${u.with_prices} with prices · snapshot ${u.snapshot}`;
    $('#ubody').innerHTML = `<div class="chips" style="margin:0 0 12px">${Object.entries(sectors).sort((a,b) => b[1]-a[1]).map(([s,n]) => `<span>${esc(s)} · ${n}</span>`).join('')}</div>
      <div class="tw"><table><thead><tr><th>Ticker</th><th>Name</th><th>Sector</th><th>Prices</th><th>From → to</th><th class="n">Days</th></tr></thead><tbody>
      ${rows.map(r => `<tr class="${r.has_prices?'click':''}" data-t="${r.has_prices?esc(r.ticker):''}"><td><code>${esc(r.ticker)}</code></td><td>${esc(r.name||'')}</td><td>${esc(r.sector||'')}</td>
        <td>${r.has_prices ? '<span class="tag t-ok">Pulled</span>' : '<span class="tag t-warn">Not yet</span>'}</td><td class="nw">${r.has_prices ? esc(r.from)+' → '+esc(r.to) : '—'}</td><td class="n">${r.has_prices ? nf(r.rows,0) : '—'}</td></tr>`).join('')}
      </tbody></table></div>${u.with_prices < u.count ? `<p class="hint" style="margin:10px 0 0">Pull the rest with <code>python -m src.ingest.run prices</code> (no <code>--limit</code>).</p>` : ''}`;
    $('#ubody').querySelectorAll('tr[data-t]').forEach(tr => { if(tr.dataset.t) tr.onclick = () => nav('prices', {m:market, t:tr.dataset.t}); });
  };
  $('#flt').oninput = paint;
  el.querySelectorAll('#only button').forEach(b => b.onclick = () => { only = b.dataset.k; el.querySelectorAll('#only button').forEach(x => x.classList.toggle('on', x===b)); paint(); });
  paint();
}

loadStatus(); render();
</script>
</body>
